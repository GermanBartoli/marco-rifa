<!doctype html>
<html lang="es-AR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Panel de Marco</title
  ><link rel="stylesheet" href="https://marco-sorteo.bartoligerman497.workers.dev/estilos.css" />
  <header>
    <a class="logo" href="https://marco-sorteo.bartoligerman497.workers.dev/">MARCO<span>SORTEO</span></a
    ><a href="/panel">Volver al panel</a>
  </header>
  <main>
    <section>
      <small>Administración</small>
      <h1>Panel de Marco<span>.</span></h1>
      <h2>Reservas y pagos</h2>
      <p>Confirmá cada pago después de verificar la acreditación.</p>
      <p>Elegí hasta cinco números disponibles para cargar un comprador. Para editar un número ocupado, seleccionalo por separado.</p>
      <button id="actualizar">Actualizar</button>
      <p id="estado" role="status"></p>
      <div id="leyenda" class="leyenda-estados"></div>
      <a id="ir-comprador" href="#comprador" hidden>Completar datos del comprador ↓</a>
      <div id="tablero-marco" class="grilla" aria-label="Estado de los números"></div>
      <form id="comprador" hidden>
        <h3 id="titulo"></h3><p id="vencimiento"></p>
        <label>Nombre<input name="nombre" required maxlength="80"></label>
        <label>Apellido (opcional)<input name="apellido" maxlength="80"></label>
        <label>WhatsApp<input type="tel" name="contacto" required maxlength="24"></label>
        <label>Estado<select name="accion">
          <option value="guardar">Conservar estado</option><option value="reservar">Reservado por Marco</option>
          <option value="revisar">Comprobante en revisión</option><option value="pagar">Vendido</option>
          <option value="liberar">Liberar número</option>
        </select></label>
        <button>Guardar</button>
      </form>
    </section>
  </main>
  <script>
    const estados = /*ESTADOS*/null;
    const obtener = id => document.getElementById(id);
    const formulario = obtener("comprador"), aviso = obtener("estado");
    const seleccion = new Map();
    let actual, guardando = false, lectura = 0;
    for (const [clave, texto] of Object.entries(estados)) {
      const etiqueta = document.createElement("span");
      etiqueta.className = "etiqueta " + clave;
      etiqueta.textContent = texto;
      obtener("leyenda").append(etiqueta);
    }
    const formato = numero => String(numero).padStart(3, "0");
    function marcar() {
      obtener("ir-comprador").hidden = !seleccion.size;
      for (const boton of obtener("tablero-marco").children) {
        const numero = Number(boton.dataset.numero);
        const marcado = seleccion.has(numero) || actual?.numero === numero;
        boton.classList.toggle("marcado", marcado);
        boton.setAttribute("aria-pressed", String(marcado));
      }
    }
    function editar(fila) {
      const disponible = fila.estado === "disponible";
      const iniciar = !disponible || !seleccion.size;
      aviso.textContent = "";
      if (disponible) {
        actual = null;
        if (seleccion.has(fila.numero)) seleccion.delete(fila.numero);
        else if (seleccion.size < 5) seleccion.set(fila.numero, fila);
        else { aviso.textContent = "Ya elegiste cinco números."; return; }
      } else {
        seleccion.clear();
        actual = fila;
      }
      marcar();
      formulario.hidden = !actual && !seleccion.size;
      if (formulario.hidden) return;
      for (const opcion of formulario.elements.accion.options)
        opcion.disabled = disponible && ["guardar", "liberar"].includes(opcion.value);
      obtener("titulo").textContent = disponible ? "Selección: " + [...seleccion.keys()].map(formato).join(", ") :
        "Número " + formato(fila.numero) + " · " + estados[fila.estado];
      obtener("vencimiento").textContent = fila.vence ? "Apartado hasta " +
        new Date(fila.vence * 1000).toLocaleString("es-AR", {timeZone: "America/Argentina/Buenos_Aires"}) + " (Argentina)" : "";
      if (iniciar) {
        for (const campo of ["nombre", "apellido", "contacto"]) formulario.elements[campo].value = fila[campo] || "";
        formulario.elements.accion.value = disponible ? "reservar" : "guardar";
      }
      if (!disponible) formulario.scrollIntoView({block: "nearest"});
    }
    async function cargar() {
      const turno = ++lectura;
      try {
        const r = await fetch("/panel/rifa/reservas");
        if (!r.ok) throw Error();
        const filas = await r.json();
        if (turno !== lectura) return;
        obtener("tablero-marco").replaceChildren(...filas.map(fila => {
          const b = document.createElement("button");
          b.textContent = String(fila.numero).padStart(3, "0");
          b.className = fila.estado;
          b.dataset.numero = fila.numero;
          b.title = [estados[fila.estado], fila.nombre, fila.apellido].filter(Boolean).join(" · ");
          b.setAttribute("aria-label", b.textContent + ", " + b.title);
          b.onclick = () => { if (!guardando) editar(fila); };
          return b;
        }));
        const elegidos = actual ? [actual] : [...seleccion.values()];
        if (elegidos.some(anterior => {
          const fila = filas.find(f => f.numero === anterior.numero);
          return !fila || fila.estado !== anterior.estado || fila.version !== anterior.version || fila.referencia !== anterior.referencia;
        })) {
          seleccion.clear();
          actual = null;
          formulario.hidden = true;
          aviso.textContent = "La selección cambió. Volvé a elegir los números.";
        }
        marcar();
      } catch { aviso.textContent = "No pudimos cargar el tablero."; }
    }
    formulario.onsubmit = async e => {
      e.preventDefault();
      if (guardando || (!actual && !seleccion.size)) return;
      const campos = Object.fromEntries(new FormData(formulario));
      if (campos.accion === "liberar" && !confirm("¿Liberar el número " + actual.numero + "?")) return;
      guardando = true;
      try {
        const r = await fetch("/panel/rifa/actualizar", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify(actual
            ? {...campos, numero:actual.numero, referencia:actual.referencia, version:actual.version}
            : {...campos, seleccion:[...seleccion.values()].map(({numero, version}) => ({numero, version}))}),
        });
        if (!r.ok) throw Error(await r.json());
        formulario.hidden = true;
        actual = null;
        seleccion.clear();
        aviso.textContent = "Cambios guardados.";
      } catch (error) { aviso.textContent = error.message; }
      finally { guardando = false; await cargar(); }
    };
    obtener("actualizar").onclick = cargar;
    cargar();
    setInterval(() => { if (!document.hidden && !guardando) cargar(); }, 30000);
  </script>
</html>
