<!doctype html>
<html lang="es-AR" class="panel-marco">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Marco · Panel de la rifa</title><link rel="icon" type="image/svg+xml" href="https://marco-sorteo.bartoligerman497.workers.dev/favicon.svg" /
  ><link rel="stylesheet" href="https://marco-sorteo.bartoligerman497.workers.dev/estilos.css" />
  <header>
    <a class="logo" href="https://marco-sorteo.bartoligerman497.workers.dev/">MARCO<span>SORTEO</span></a>
    <nav class="acciones-panel" aria-label="Navegación del panel">
      <a href="https://marco-sorteo.bartoligerman497.workers.dev/" target="_blank" rel="noopener" aria-label="Abrir rifa en otra pestaña">Abrir rifa <span aria-hidden="true">↗</span></a>
      <a href="/panel">Volver al panel</a>
    </nav>
  </header>
  <main>
    <section>
      <div class="encabezado-tablero">
      <small>Administración</small>
      <h1>Panel de Marco<span>.</span></h1>
      <h2>Reservas y pagos</h2>
      <p>Confirmá cada pago después de verificar la acreditación.</p>
      <p>Tocá un número para ver o editar los datos del comprador.</p>
      <button id="actualizar">Actualizar</button>
      </div>
      <div class="pendientes-panel">
        <div id="apartados" hidden>
          <h3>Apartados por 8 horas</h3>
          <div id="reservas-rapidas" class="lista-pendientes"></div>
        </div>
        <div id="reservados" hidden>
          <h3>Reservados por Marco</h3>
          <div id="ventas-pendientes" class="lista-pendientes"></div>
        </div>
      </div>
      <dialog id="venta" aria-labelledby="titulo-venta" aria-describedby="detalle-venta">
        <h3 id="titulo-venta">Confirmar venta</h3>
        <p id="detalle-venta"></p>
        <form method="dialog">
          <button value="cancelar" autofocus>Cancelar</button>
          <button value="vender">Marcar como vendido</button>
        </form>
      </dialog>
      <p id="estado" role="status"></p>
      <div id="leyenda" class="leyenda-estados"></div>
      <div class="opciones-numeros">
        <label><input id="multiple" type="checkbox"> Seleccionar varios números</label>
        <button id="completar" hidden>Completar datos</button>
        <span id="cantidad" role="status"></span>
      </div>
      <div class="zona-numeros">
      <div id="tablero-marco" class="grilla" aria-label="Estado de los números"></div>
      <div id="nube" role="dialog" aria-labelledby="titulo" hidden>
      <form id="comprador">
        <button type="button" id="cerrar" aria-label="Cerrar ficha">×</button>
        <h3 id="titulo" tabindex="-1"></h3><p id="vencimiento"></p>
        <label>Nombre<input name="nombre" required maxlength="80"></label>
        <label>Apellido (opcional)<input name="apellido" maxlength="80"></label>
        <label>WhatsApp
          <span class="telefono-comprador"><span id="prefijo">+54</span><input type="tel" name="contacto" required maxlength="24" placeholder="351 123 4567"></span>
        </label>
        <label>Estado<select name="accion">
          <option value="guardar">Conservar estado</option><option value="reservar">Reservado por Marco</option>
          <option value="revisar">Comprobante en revisión</option><option value="pagar">Vendido</option>
          <option value="liberar">Liberar número</option>
        </select></label>
        <a id="mensaje-comprador" target="_blank" rel="noopener noreferrer" aria-disabled="true">Enviar por WhatsApp ↗</a>
        <button>Guardar</button>
      </form>
      </div>
      </div>
    </section>
  </main>
  <script>
    const estados = /*ESTADOS*/null;
    const obtener = id => document.getElementById(id);
    const formulario = obtener("comprador"), aviso = obtener("estado");
    const seleccion = new Map();
    let actual, guardando = false, lectura = 0;
    for (const [clave, texto] of Object.entries(estados)) {
      const etiqueta = document.createElement("span");
      etiqueta.className = "etiqueta " + clave;
      etiqueta.textContent = texto;
      obtener("leyenda").append(etiqueta);
    }
    const formato = numero => String(numero).padStart(3, "0");
    const nube = obtener("nube"), multiple = obtener("multiple"), completar = obtener("completar");
    const tablero = obtener("tablero-marco");
    let numeroAncla;
    function ancla() {
      return tablero.querySelector('[data-numero="' + numeroAncla + '"]');
    }
    function ubicar() {
      const boton = ancla();
      if (nube.hidden || !boton) return;
      const centro = boton.offsetLeft + boton.offsetWidth / 2;
      const izquierda = Math.max(0, Math.min(centro - nube.offsetWidth / 2, tablero.clientWidth - nube.offsetWidth));
      const rect = boton.getBoundingClientRect();
      const arriba = rect.top > innerHeight - rect.bottom;
      nube.classList.toggle("encima", arriba);
      nube.style.left = izquierda + "px";
      nube.style.top = (arriba ? boton.offsetTop - 10 : boton.offsetTop + boton.offsetHeight + 10) + "px";
      nube.style.setProperty("--punta", (centro - izquierda) + "px");
      formulario.style.maxHeight = Math.max(120, (arriba ? rect.top : innerHeight - rect.bottom) - 22) + "px";
    }
    function cerrarFicha() {
      nube.hidden = true;
      if (!multiple.checked) seleccion.clear();
      actual = null;
      marcar();
    }
    obtener("cerrar").onclick = () => {
      cerrarFicha();
      (multiple.checked ? completar : ancla())?.focus({preventScroll:true});
    };
    document.addEventListener("click", e => {
      if (nube.hidden || nube.contains(e.target) || guardando) return;
      const yaElegido = e.target.closest("#tablero-marco button")?.getAttribute("aria-pressed") === "true";
      seleccion.clear();
      cerrarFicha();
      if (yaElegido) e.stopPropagation();
    }, true);
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && !nube.hidden) obtener("cerrar").click();
    });
    multiple.onchange = () => { seleccion.clear(); cerrarFicha(); };
    completar.onclick = () => {
      const fila = [...seleccion.values()].at(-1);
      if (!fila) return;
      numeroAncla = fila.numero;
      ancla().scrollIntoView({block:"center", behavior:"instant"});
      abrirFicha(fila);
    };
    window.addEventListener("resize", ubicar);
    function marcar() {
      completar.hidden = !multiple.checked;
      completar.disabled = !seleccion.size;
      obtener("cantidad").textContent = multiple.checked ? seleccion.size + " de 20 elegidos" : "";
      for (const boton of obtener("tablero-marco").children) {
        const numero = Number(boton.dataset.numero);
        const marcado = seleccion.has(numero) || actual?.numero === numero;
        boton.disabled = multiple.checked && !boton.classList.contains("disponible");
        boton.classList.toggle("marcado", marcado);
        boton.setAttribute("aria-pressed", String(marcado));
      }
    }
    function editar(fila) {
      const disponible = fila.estado === "disponible";
      aviso.textContent = "";
      if (multiple.checked) {
        if (!disponible) return;
        nube.hidden = true;
        if (seleccion.has(fila.numero)) seleccion.delete(fila.numero);
        else if (seleccion.size < 20) seleccion.set(fila.numero, fila);
        else { aviso.textContent = "Ya elegiste veinte números."; }
        marcar();
        return;
      }
      seleccion.clear();
      actual = disponible ? null : fila;
      if (disponible) seleccion.set(fila.numero, fila);
      numeroAncla = fila.numero;
      marcar();
      abrirFicha(fila);
    }
    const contacto = formulario.elements.contacto, mensaje = obtener("mensaje-comprador");
    function actualizarWhatsApp(formatear = false) {
      const valor = contacto.value.trim();
      const digitos = valor.replace(/\D/g, "").replace(/^00/, "");
      const internacional = /^(\+|00)/.test(valor);
      const nacional = digitos.match(/^549?(\d{10})$/)?.[1] ||
        (!internacional && digitos.match(/^(?:0|9)?(\d{10})$/)?.[1]);
      let destino = "";
      if (/^\+?[\d ()-]+$/.test(valor)) {
        if (nacional) {
          destino = "549" + nacional;
          if (formatear) contacto.value = nacional;
        } else if (internacional && !digitos.startsWith("54") && /^[1-9]\d{6,14}$/.test(digitos)) {
          destino = digitos;
        }
      }
      obtener("prefijo").hidden = /^(\+|00)/.test(contacto.value.trim());
      mensaje.setAttribute("aria-disabled", String(!destino));
      if (destino) mensaje.href = "https://wa.me/" + destino;
      else mensaje.removeAttribute("href");
    }
    contacto.addEventListener("input", () => actualizarWhatsApp());
    contacto.addEventListener("blur", () => actualizarWhatsApp(true));
    function abrirFicha(fila) {
      const disponible = fila.estado === "disponible";
      nube.hidden = false;
      for (const opcion of formulario.elements.accion.options)
        opcion.disabled = disponible && ["guardar", "liberar"].includes(opcion.value);
      obtener("titulo").textContent = multiple.checked ? "Números " + [...seleccion.keys()].map(formato).join(", ") :
        "Número " + formato(fila.numero) + " · " + estados[fila.estado];
      obtener("vencimiento").textContent = fila.vence ? "Apartado hasta " +
        new Date(fila.vence * 1000).toLocaleString("es-AR", {timeZone: "America/Argentina/Buenos_Aires"}) + " (Argentina)" : "";
      for (const campo of ["nombre", "apellido"]) formulario.elements[campo].value = fila[campo] || "";
      const guardado = fila.contacto || "";
      contacto.value = /^\d{11,15}$/.test(guardado) && !guardado.startsWith("54") && !guardado.startsWith("0")
        ? "+" + guardado : guardado;
      actualizarWhatsApp(true);
      formulario.elements.accion.value = disponible ? "reservar" : "guardar";
      ubicar();
      obtener("titulo").focus({preventScroll:true});
    }
    const venta = obtener("venta");
    let ventaPendiente;
    venta.addEventListener("close", () => {
      const datos = ventaPendiente;
      ventaPendiente = null;
      if (venta.returnValue === "vender" && datos) guardar(datos, true);
    });
    function listarPendientes(filas, estado, grupo, lista) {
      const pendientes = filas.filter(fila => fila.estado === estado);
      const vender = estado === "reservado";
      obtener(grupo).hidden = !pendientes.length;
      obtener(lista).replaceChildren(...pendientes.map(fila => {
        const boton = document.createElement("button");
        const nombre = [fila.nombre, fila.apellido].filter(Boolean).join(" ");
        const detalle = [formato(fila.numero), nombre].filter(Boolean).join(" · ");
        boton.className = estado;
        boton.textContent = (vender ? "Vender " : "Reservar ") + detalle;
        boton.onclick = () => {
          if (guardando) return;
          const datos = {accion: vender ? "pagar" : "reservar", numero: fila.numero,
            referencia: fila.referencia, version: fila.version};
          if (!vender) return guardar(datos, true);
          ventaPendiente = datos;
          obtener("detalle-venta").textContent = "¿Confirmás el pago del número " + detalle + "?";
          venta.returnValue = "";
          venta.showModal();
        };
        return boton;
      }));
    }
    async function cargar() {
      const turno = ++lectura;
      try {
        const r = await fetch("/panel/rifa/reservas");
        if (!r.ok) throw Error();
        const filas = await r.json();
        if (turno !== lectura) return;
        obtener("tablero-marco").replaceChildren(...filas.map(fila => {
          const b = document.createElement("button");
          b.textContent = String(fila.numero).padStart(3, "0");
          b.className = fila.estado;
          b.dataset.numero = fila.numero;
          b.title = [estados[fila.estado], fila.nombre, fila.apellido].filter(Boolean).join(" · ");
          b.setAttribute("aria-label", b.textContent + ", " + b.title);
          b.onclick = () => { if (!guardando) editar(fila); };
          return b;
        }));
        listarPendientes(filas, "apartado", "apartados", "reservas-rapidas");
        listarPendientes(filas, "reservado", "reservados", "ventas-pendientes");
        const elegidos = actual ? [actual] : [...seleccion.values()];
        if (elegidos.some(anterior => {
          const fila = filas.find(f => f.numero === anterior.numero);
          return !fila || fila.estado !== anterior.estado || fila.version !== anterior.version || fila.referencia !== anterior.referencia;
        })) {
          seleccion.clear();
          actual = null;
          nube.hidden = true;
          aviso.textContent = "La selección cambió. Volvé a elegir los números.";
        }
        marcar();
        ubicar();
      } catch { aviso.textContent = "No pudimos cargar el tablero."; }
    }
    formulario.onsubmit = async e => {
      e.preventDefault();
      if (guardando || (!actual && !seleccion.size)) return;
      const campos = Object.fromEntries(new FormData(formulario));
      if (campos.accion === "liberar" && !confirm("¿Liberar el número " + actual.numero + "?")) return;
      await guardar(actual
        ? {...campos, numero:actual.numero, referencia:actual.referencia, version:actual.version}
        : {...campos, seleccion:[...seleccion.values()].map(({numero, version}) => ({numero, version}))});
    };
    async function guardar(datos, rapido = false) {
      if (guardando) return;
      guardando = true;
      try {
        const r = await fetch("/panel/rifa/actualizar", {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify(datos),
        });
        if (!r.ok) throw Error(await r.json());
        if (!rapido || actual?.numero === datos.numero) {
          nube.hidden = true;
          actual = null;
          seleccion.clear();
        }
        aviso.textContent = rapido ? "Número " + formato(datos.numero) + (datos.accion === "pagar" ? " vendido." : " reservado por Marco.") : "Cambios guardados.";
      } catch (error) { aviso.textContent = error.message; }
      finally { await cargar(); guardando = false; }
    }
    obtener("actualizar").onclick = cargar;
    cargar();
    setInterval(() => { if (!document.hidden && !guardando) cargar(); }, 30000);
  </script>
</html>
